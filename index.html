<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaxenHub</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    :root {
      --page: #080f1d;
      --panel: #101c31;
      --panel-hover: #142642;
      --border: #203b60;
      --text: #f4f8ff;
      --muted: #9db2d0;
      --blue: #398bff;
      --blue-light: #75b2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 54px clamp(18px, 6vw, 100px) 80px;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(26, 105, 210, .28), transparent 58%),
        var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 1500px; margin: 0 auto; }
    header { text-align: center; margin: 0 0 48px; }
    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 92px);
      line-height: 1.04;
      letter-spacing: -.065em;
      font-weight: 800;
      color: #f5f9ff;
      text-shadow: 0 0 36px rgba(57,139,255,.22);
    }
    .subtitle {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 20px);
    }
    #cards { display: grid; gap: 16px; }
    .link-card {
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 112px;
      padding: 22px 28px 22px 34px;
      border: 1px solid var(--border);
      border-radius: 34px;
      background: rgba(16, 28, 49, .96);
      text-decoration: none;
      color: inherit;
      transition: background .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .link-card:hover {
      background: var(--panel-hover);
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 12px 34px rgba(0, 75, 180, .16);
    }
    .card-copy { flex: 1; min-width: 0; }
    .card-title {
      margin: 0 0 10px;
      color: var(--text);
      font-size: clamp(21px, 2.4vw, 32px);
      line-height: 1.12;
      font-weight: 720;
      letter-spacing: -.035em;
      overflow-wrap: anywhere;
    }
    .card-description {
      margin: 0;
      color: var(--muted);
      font-size: clamp(15px, 1.7vw, 24px);
      line-height: 1.25;
      font-weight: 400;
      overflow-wrap: anywhere;
    }
    .arrow {
      flex: 0 0 72px;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border: 2px solid #24466f;
      border-radius: 50%;
      color: var(--blue-light);
      transition: .2s ease;
    }
    .link-card:hover .arrow {
      color: white;
      border-color: var(--blue);
      background: rgba(57,139,255,.14);
    }
    .arrow svg { width: 34px; height: 34px; }
    @media (max-width: 620px) {
      body { padding: 34px 16px 60px; }
      header { margin-bottom: 30px; }
      .link-card { min-height: 96px; padding: 18px 16px 18px 20px; gap: 12px; border-radius: 22px; }
      .arrow { flex-basis: 54px; width: 54px; height: 54px; border-width: 1px; }
      .arrow svg { width: 23px; height: 23px; }
      .card-title { margin-bottom: 7px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>MaxenHub</h1>
      <p class="subtitle">Get your stuff and get out.</p>
    </header>

    <section id="cards" aria-label="Hub links"></section>
  </main>

  <script>
    const buttons = [
      {
        title: "Moonlit ADB",
        description: "Moonlit stuff",
        url: "https://stripes.lol/downloads/menus/Moonlit.apk"
      },

      {
        title: "Lightning Launcher",
        description: "Download lightning launcher",
        url: "https://github.com/threethan/LightningLauncher/releases/latest"
      },

      {
        title: "Standalone ADB",
        description: "Allows you to run ADB commands without a PC",
        url: "https://www.mediafire.com/file/6pn3py2fj5gga97/QuestADB-v1.0-debug.apk/file"
      },

      {
        title: "Requable",
        description: "For the Bwah mods no root",
        url: "https://app.reqable.com/download?platform=android&arch=arm64&ext=apk&locale=en-US"
      },

      {
        title: "Bwah mods standy NO ROOT",
        description: "Link to standy Bwah mods",
        url: "https://akidin-client.onrender.com/"
      },

      {
        title: "Standalone AC mods",
        description: "Link to standalone AC mods",
        url: "https://www.mikeybox.ai/"
      },

      {
        title: "Standalone Gorilla Tag mods",
        description: "Standalone mods for Gorilla Tag",
        url: "https://drive.google.com/file/d/1kEnFLwYFqU55neFbg11HJmdNBxP5A6Wr/view?usp=sharing"
      },

      {
        title: "Singularity",
        description: "Root exploit for v2.7 and below",
        url: "https://github.com/Lumince/singularity/releases/latest"
      },

      {
        title: "Quest Tools",
        description: "Quest Tools | for patching games with libs",
        url: "https://dabean24.itch.io/quest-tools"
      },

    ];

    const cards = document.getElementById("cards");

    buttons.forEach((button) => {
      const link = document.createElement("a");
      link.className = "link-card";
      link.href = button.url || "#";
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      const copy = document.createElement("div");
      copy.className = "card-copy";

      const title = document.createElement("h2");
      title.className = "card-title";
      title.textContent = button.title || "Untitled";

      const description = document.createElement("p");
      description.className = "card-description";
      description.textContent = button.description || "";

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>`;

      copy.append(title, description);
      link.append(copy, arrow);
      cards.appendChild(link);
    });
  </script>
</body>
</html>
